name: Publish to npm

# Release flow:
#   npm version patch|minor|major   # bumps package.json and creates a vX.Y.Z tag
#   git push --follow-tags
#
# Auth uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# Configure it at npmjs.com → ping-pong-marquee → Settings → Trusted publishing
# with workflow filename "publish.yml".

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) + provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm CLI >= 11.5.1
      - run: npm install -g npm@latest

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      # prepublishOnly runs build:lib before publishing
      - run: npm publish
